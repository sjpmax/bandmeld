<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="BandSnap" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .band { fill: #141414 } .venue { fill: #e8462b } .note { fill: #faf8f4 }
    @media (prefers-color-scheme: dark) {
      .band { fill: #faf8f4 } .note { fill: #141414 }
    }
  </style>
  <defs>
    <path id="tab" d="M116 72 H128 A16 16 0 1 1 128 88 H116 Z"/>
    <mask id="socket">
      <rect width="240" height="160" fill="#fff"/>
      <use href="#tab" fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- left piece: the band -->
  <g class="band">
    <rect x="16" y="16" width="104" height="128" rx="14"/>
    <use href="#tab"/>
  </g>
  <!-- right piece: the venue, with a socket for the band's tab -->
  <rect class="venue" x="124" y="16" width="100" height="128" rx="14" mask="url(#socket)"/>
  <!-- beamed eighth notes joining the two pieces -->
  <g class="note">
    <ellipse cx="62" cy="114" rx="16" ry="11.5" transform="rotate(-22 62 114)"/>
    <ellipse cx="180" cy="102" rx="16" ry="11.5" transform="rotate(-22 180 102)"/>
    <rect x="72.5" y="44" width="6" height="68"/>
    <rect x="190.5" y="32" width="6" height="68"/>
    <polygon points="72.5,42 196.5,30 196.5,46 72.5,58"/>
  </g>
</svg>

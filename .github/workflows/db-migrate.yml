name: Supabase migrations

# Runs `supabase db push` whenever a new file lands under supabase/migrations/
# on the default branch (or when triggered manually). The Supabase CLI applies
# any migrations the linked project has not yet seen; files already applied
# are no-ops.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token
#                             (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   — the ~20-char project ref
#                             (from the dashboard URL)
#   SUPABASE_DB_PASSWORD   — database password for the linked project
#                             (Settings → Database → Connection string)

on:
  push:
    branches: [master, main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push --include-all
